<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doubloon — островная коллекция фигурок</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/index.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { fontFamily: {
    display: ['Unbounded','sans-serif'],
    body: ['Manrope','sans-serif'],
  }}}
};
</script>
<style>
  html,body{height:100%}
  body{font-family:'Manrope',system-ui,sans-serif;background:#04060C;overflow:hidden}
  ::selection{background:#D4AF37;color:#111}

  #phone{
    --bg:#0A0E17; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.10); --txt:#F3F4F6; --txt2:rgba(243,244,246,.55);
  }
  #phone[data-theme="light"]{
    --bg:#EEF1F6; --panel:rgba(255,255,255,.85); --panel2:#ffffff;
    --line:rgba(17,24,39,.12); --txt:#111827; --txt2:rgba(17,24,39,.55);
  }
  #content::-webkit-scrollbar,.no-sb::-webkit-scrollbar{display:none}
  #content,.no-sb{scrollbar-width:none}

  .screen{display:none}
  .screen.active{display:block;animation:scrIn .35s cubic-bezier(.2,.7,.3,1)}
  @keyframes scrIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* карточки фигурок */
  .figcard{aspect-ratio:2/3;border:3px solid var(--rc,#9CA3AF);border-radius:12px;position:relative;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45);
    transition:transform .2s;cursor:pointer}
  .figcard:active{transform:scale(.96)}
  .figcard .art{flex:1;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
  .figcard .plate{padding:5px 6px 6px;background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
  .figcard .holo{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.4) 46%,rgba(255,255,255,.1) 52%,transparent 66%);
    background-size:220% 220%;animation:holo 3.2s linear infinite}
  @keyframes holo{0%{background-position:120% 120%}100%{background-position:-60% -60%}}
  .dup{position:absolute;top:5px;right:5px;background:#111827e6;color:#FBBF24;font-weight:800;
    font-size:10px;padding:2px 6px;border-radius:8px;border:1px solid #FBBF2455}
  .newtag{position:absolute;top:5px;left:5px;background:#34D399;color:#052e1c;font-weight:800;
    font-size:9px;padding:2px 6px;border-radius:8px;letter-spacing:.05em}

  /* сундук и открытие */
  .chestIdle{animation:chestFloat 2.4s ease-in-out infinite}
  @keyframes chestFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .chestShake{animation:chestShake .5s ease-in-out infinite}
  @keyframes chestShake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-7deg) scale(1.04)}
    40%{transform:rotate(7deg)}60%{transform:rotate(-5deg) scale(1.06)}80%{transform:rotate(5deg)}}
  .flashfx{animation:flashfx .35s ease-out forwards}
  @keyframes flashfx{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.2)}}
  .cardIn{animation:cardIn .65s cubic-bezier(.2,.7,.3,1)}
  @keyframes cardIn{0%{transform:scale(.25) rotateY(180deg);opacity:0}60%{transform:scale(1.1) rotateY(0)}100%{transform:scale(1)}}
  .rays{position:absolute;inset:-70px;animation:raysSpin 7s linear infinite;filter:blur(2px);border-radius:50%}
  @keyframes raysSpin{to{transform:rotate(360deg)}}
  .spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;animation:sparkFly .95s ease-out forwards}
  @keyframes sparkFly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

  /* карта */
  .islandCard{animation:islFloat 5s ease-in-out infinite;transition:transform .18s}
  .islandCard:active{transform:scale(.97)}
  @keyframes islFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
  .sea{background:
    radial-gradient(90% 50% at 50% 0%,rgba(30,64,120,.55),transparent),
    radial-gradient(70% 40% at 80% 90%,rgba(20,90,110,.35),transparent),
    var(--bg);background-size:100% 100%,140% 140%,100% 100%;
    animation:seaMove 12s ease-in-out infinite alternate}
  @keyframes seaMove{to{background-position:0 0,60% 30%,0 0}}
  .goldGlow{box-shadow:0 0 0 2px #D4AF37,0 0 34px -4px #D4AF37aa;animation:goldPulse 2.4s ease-in-out infinite}
  @keyframes goldPulse{50%{box-shadow:0 0 0 2px #D4AF37,0 0 50px -2px #D4AF37dd}}

  .shelf{background:
    repeating-linear-gradient(90deg,#6b4a2b 0 46px,#7a5533 46px 92px),
    linear-gradient(#00000033,#00000055);
    background-blend-mode:multiply;box-shadow:inset 0 -8px 14px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.5)}
  .shelfGlow{animation:shelfPulse 2.2s ease-in-out infinite}
  @keyframes shelfPulse{50%{filter:drop-shadow(0 0 14px var(--rc)) brightness(1.12)}}
  .cannonCharging{animation:cannonShake 0.15s ease-in-out infinite}
  @keyframes cannonShake{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(-2px,1px) rotate(-1deg)}75%{transform:translate(2px,-1px) rotate(1deg)}}

  .tabbtn{transition:all .2s;color:var(--txt2)}
  .tabbtn.tab-active{color:#D4AF37;transform:translateY(-2px)}
  .redDot{position:absolute;top:7px;right:14px;width:7px;height:7px;border-radius:50%;background:#F87171;box-shadow:0 0 8px #F87171}

  #toasts>div{animation:toastIn .35s cubic-bezier(.2,.7,.3,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}

  .crPop{animation:crPop .4s cubic-bezier(.2,.7,.3,1)}
  @keyframes crPop{40%{transform:scale(1.25)}}

  .wig{animation:wig .5s ease-in-out}
  @keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  input,select{outline:none}
  select option{background:#111827;color:#fff}
  .brand-logo{height:22px;width:auto;display:block;filter:none;transition:filter .2s}
  #phone[data-theme="dark"] .brand-logo{filter:invert(1) brightness(1.08)}
  .brand-logo-lg{height:56px;width:auto;display:block;margin:0 auto;filter:none}
  #phone[data-theme="dark"] .brand-logo-lg{filter:invert(1) brightness(1.08)}
</style>
</head>

  <!-- контент -->
  <main id="content" class="flex-1 overflow-y-auto relative z-10">

    <!-- КАРТА -->
    <section id="scr-map" class="screen sea min-h-full">
      <div class="px-5 pt-5 pb-2">
        <h1 class="font-display font-bold text-xl">Карта островов</h1>
        <p class="text-sm mt-1" style="color:var(--txt2)">Все 5 островов открыты — выбирай, куда отправиться</p>
      </div>
      <div id="mapList" class="px-5 pb-8 pt-2 space-y-4"></div>
    </section>

    <!-- ОСТРОВ -->
    <section id="scr-island" class="screen min-h-full">
      <div id="islandBody"></div>
    </section>

    <!-- СОКРОВИЩНИЦА -->
    <section id="scr-treasury" class="screen min-h-full">
      <div class="px-5 pt-5 pb-2">
        <h1 class="font-display font-bold text-xl">Сокровищница</h1>
        <p id="tresStats" class="text-sm mt-1" style="color:var(--txt2)"></p>
      </div>
      <div class="px-5 pb-3">
        <div class="rounded-2xl p-4 border" style="border-color:var(--line);background:var(--panel)">
          <div class="flex items-center justify-between mb-3">
            <div class="text-[10px] font-bold uppercase tracking-widest" style="color:var(--txt2)">🖼️ Полка-виджет · 2–3 любимые фигурки</div>
            <button id="widgetToggleBtn" class="text-xs font-bold" style="color:#D4AF37">Изменить</button>
          </div>
          <div id="shelfBox" class="shelf rounded-xl p-3 flex items-end justify-center gap-3 min-h-[130px]"></div>
          <div id="shelfSkinPicker" class="flex gap-2 mt-3 overflow-x-auto pb-1"></div>
          <div id="widgetPicker" class="grid grid-cols-4 gap-2.5 mt-3 hidden"></div>
        </div>
      </div>
      <div class="px-5 space-y-3 pb-3">
        <input id="tresQ" type="text" placeholder="🔍 Поиск фигурки…" class="w-full px-4 py-3 rounded-xl text-sm border" style="background:var(--panel);border-color:var(--line);color:var(--txt)">
        <div id="islChips" class="flex gap-2 overflow-x-auto no-sb pb-1"></div>
        <div class="flex gap-2">
          <select id="rarSel" class="flex-1 px-3 py-2.5 rounded-xl text-sm border" style="background:var(--panel);border-color:var(--line);color:var(--txt)">
            <option value="all">Все редкости</option>
            <option value="C">Обычные</option><option value="U">Необычные</option>
            <option value="R">Редкие</option><option value="E">Эпические</option><option value="L">Легендарные</option>
          </select>
          <select id="sortSel" class="flex-1 px-3 py-2.5 rounded-xl text-sm border" style="background:var(--panel);border-color:var(--line);color:var(--txt)">
            <option value="rarity">По редкости</option>
            <option value="score">По очкам</option>
            <option value="date">Сначала новые</option>
            <option value="name">По имени</option>
            <option value="island">По острову</option>
          </select>
        </div>
      </div>
      <div id="tresGrid" class="grid grid-cols-3 gap-3 px-5 pb-8 pt-1"></div>
      <div id="tresEmpty" class="hidden px-5 pb-10 text-center text-sm" style="color:var(--txt2)"></div>
    </section>

    <!-- РЫНОК -->
    <section id="scr-market" class="screen min-h-full">
      <div class="px-5 pt-5 pb-2">
        <h1 class="font-display font-bold text-xl">Рынок</h1>
        <p class="text-sm mt-1" style="color:var(--txt2)">Обменивайся фигурками с другими капитанами</p>
      </div>
      <div class="px-5 pb-3">
        <input id="marketSearch" type="text" placeholder="🔍 Найти фигурку и узнать её стоимость…" class="w-full px-4 py-3 rounded-xl text-sm border" style="background:var(--panel);border-color:var(--line);color:var(--txt)">
        <div id="marketSearchResults" class="mt-2 hidden"></div>
      </div>
      <div class="px-5 pb-3">
        <button id="createListingBtn" class="w-full py-3 rounded-xl font-display font-bold text-sm text-black" style="background:linear-gradient(90deg,#D4AF37,#f5d76e)">➕ Выставить фигурку на обмен</button>
      </div>
      <div class="px-5 pb-2 text-sm font-bold">Мои объявления</div>
      <div id="myListings" class="px-5 pb-4 space-y-2"></div>

      <div id="marketList" class="px-5 pb-8 space-y-2"></div>

];
const FRAMES = {}; const FRAMELIST = [];
FRAME_DATA.forEach((f,i)=>{

});
const FRAME_DROP_CHANCE = { std:0.10, prem:0.20 };
const FRAME_DUP_VALUE = { C:20, U:40, R:80, E:160, L:320 };
function frameRingStyle(frameId, glowSize){
  const fr = FRAMES[frameId];
  if(!fr) return '';
  const [c1,c2] = fr.grad.split(',');
  return 'box-shadow:0 0 0 3px '+c1+',0 0 '+(glowSize||14)+'px '+c2+'aa;';
}
function tryDropFrame(rar, type){
  if(Math.random() > (FRAME_DROP_CHANCE[type]||0)) return null;
  const pool = FRAMELIST.filter(f=>f.rar===rar);
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

// порох + 2 одинаковые копии. Выстрел либо повышает версию, либо (в случае
// неудачи) взрывает всё содержимое пушки без остатка.
// Порох теперь падает отдельным, независимым броском — как рамки и полки,
// а не гарантированно с каждого сундука.
const POWDER_DROP_CHANCE = { std:0.35, prem:0.55 };
const POWDER_DROP = { std:[6,14], prem:[14,28] };
function tryDropPowder(type){
  if(Math.random() > (POWDER_DROP_CHANCE[type]||0)) return 0;
  const [lo,hi] = POWDER_DROP[type] || POWDER_DROP.std;
  return lo + Math.floor(Math.random()*(hi-lo+1));
}

function seasonLevelType(level){
  // Финальный уровень — гарантированный эксклюзив-легенда пропуска
  if(level===SEASON_MAX_LEVEL) return 'figure';
  const m = (level-1)%5;
  return ['coins','chest','figure','powder','shelf'][m];
}
function seasonCoinsForLevel(level){ return Math.round((25+level*5)/5)*5; }
function seasonPowderForLevel(level){ return Math.round((30+level*6)/5)*5; }
// Минимальная стоимость содержимого сундука пропуска — обычная фигурка (🪙 100 ≈ $1),
// максимум — легендарная (до 🪙 4000). Реальная ценность выясняется только при открытии.
const SEASON_CHEST_MIN = 100; // = MARKET_PRICE.C, продублировано, т.к. объявляется раньше блока рынка
function seasonPremiumReward(level){
  const type = seasonLevelType(level);
  if(type==='coins') return { type:'coins', doubloons: seasonCoinsForLevel(level) };
  if(type==='chest') return { type:'chest', chestMin: SEASON_CHEST_MIN };
  if(type==='powder') return { type:'powder', amount: seasonPowderForLevel(level) };
  if(type==='shelf') return { type:'shelf' };
  const fid = (level===SEASON_MAX_LEVEL) ? SEASON_FIGLIST[SEASON_FIGLIST.length-1].id : SEASON_FIGLIST[level-1].id;
  return { type:'figure', fid };
}
// Пропуск прокачивается САМ, по одному уровню за каждый пройденный календарный
// день (а не за действия игрока) — проверяем при каждом запуске игры. Если
// игрок пропустил несколько дней, уровни засчитываются за всё пропущенное
// время сразу (но не выше максимума).
function daysBetween(dateStrA, dateStrB){
  const a = new Date(dateStrA), b = new Date(dateStrB);
  return Math.round((b - a) / 86400000);
}
function checkSeasonDayLevel(){
  const s = state.season;
  if(s.level>=SEASON_MAX_LEVEL) return;
  const today = todayStr();
  const passed = daysBetween(s.lastLevelDate, today);
  if(passed<=0) return;
  const before = s.level;
  s.level = Math.min(SEASON_MAX_LEVEL, s.level + passed);
  s.lastLevelDate = today;
  save();
  if(s.level>before && $('#scr-season') && $('#scr-season').classList.contains('active')) renderSeason();
}
function hasSeasonClaimable(){
  const s = state.season;
  if(!s.premium) return false; // без покупки пропуска забирать нечего
  for(let lvl=1; lvl<=s.level; lvl++){
    if(!s.claimedPremium.includes(lvl)) return true;
  }
  return false;
}
function buySeasonPremium(){
  if(state.season.premium){ return; }
  if(state.crystals < SEASON_PASS_COST){ toast('Не хватает дублонов 🪙 — нажмите на баланс вверху'); return; }
  state.crystals -= SEASON_PASS_COST;
  state.season.premium = true;
  save(); updateHud(); confetti(); vibrate([40,60,90]);
  toast('🎫 Премиум пропуск активирован! Теперь доступны все сезонные награды');
  renderSeason();
}
function claimSeasonLevel(level){
  const s = state.season;
  if(s.level<level) return;
  if(!s.premium){ toast('Нужен платный пропуск 🎫 — без него награды уровней недоступны'); return; }
  if(s.claimedPremium.includes(level)) return;
  s.claimedPremium.push(level);
  const rw = seasonPremiumReward(level);
  let msg;
  if(rw.type==='coins'){
    state.crystals += rw.doubloons;
    msg = '🌟 Награда '+level+' уровня: +'+rw.doubloons+' 🪙';
  } else if(rw.type==='chest'){
    const rar = rollRarity(STD_ODDS);
    const pool = FIGLIST.filter(f=>f.rar===rar);
    const fig = pool[Math.floor(Math.random()*pool.length)];
    state.col.push({fid:fig.id, island:fig.island, at:Date.now()});
    const val = MARKET_PRICE[fig.rar];
    msg = '📦 Сундук пропуска ('+level+' ур.): «'+fig.name+'» · '+RARITY[fig.rar].short+' (≈🪙 '+val+', $'+usd(val)+')';
  } else if(rw.type==='powder'){
    state.powder += rw.amount;
    msg = '🧨 Порох пропуска ('+level+' ур.): +'+rw.amount+' (всего: '+state.powder+')';
  } else if(rw.type==='shelf'){
    const missing = SHELF_DROPPABLE.filter(sk=>!state.shelfSkins.includes(sk.id));
    if(missing.length){
      const sk = missing[Math.floor(Math.random()*missing.length)];
      state.shelfSkins.push(sk.id);
      msg = '🗄️ Полка пропуска ('+level+' ур.): «'+sk.name+'»! Смените её в сокровищнице';
    } else {
      state.crystals += 150;
      msg = '🗄️ Все полки уже собраны — вместо повтора +150 🪙';
    }
  } else {
    state.col.push({fid:rw.fid, island:'season', at:Date.now()});
    msg = '🌟 Эксклюзив пропуска ('+level+' ур.): «'+SEASON_FIGS[rw.fid].name+'»! Такую фигурку можно получить только из пропуска';
    if(level===SEASON_MAX_LEVEL && !state.shelfSkins.includes('season')){
      state.shelfSkins.push('season');
      msg += ' А ещё — эксклюзивная «Сезонная» полка для витрины! 🗄️';
    }
  }
  save(); updateHud(); checkAch(); confetti(); vibrate([40,60,90]);
  toast(msg);
  renderSeason();
}

function seedFrom(str){ let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))>>>0; } return h; }
function makeMember(name, seed){
  const av = AVATAR_OPTIONS[seed % AVATAR_OPTIONS.length];
  const screenname = name.toLowerCase().replace(/[^a-zа-яё]/gi,'').split(' ')[0].slice(0,3)
    .replace(/[а-яё]/g,'x') + (seed%90+10);
  const day = 1+(seed%28), month = 1+(seed*3%12), year = 1975+(seed*7%30);
  const showcase = [0,1,2].map(k=>{
    const fig = FIGLIST[(seed*13+k*37) % FIGLIST.length];
    return { fid: fig.id, count: 1 + (seed+k)%4 };
  });
  return {
    id: 'bot_'+seed, name, avatar: av, screenname,
    birthday: day+'.'+String(month).padStart(2,'0')+'.'+year,
    mobile: '', bio: 'Пират до мозга костей 🏴‍☠️',
    joinedAt: Date.now() - (seed%40)*86400000,
    isBot: true, showcase,
  };
}

function readAndResizeImage(file, maxSize, callback){
  if(!file.type || !file.type.startsWith('image/')){ toast('Выберите файл изображения'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSize/Math.max(w,h));
      w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try{ callback(canvas.toDataURL('image/jpeg', 0.85)); }
      catch(err){ toast('Не удалось обработать фото'); }
    };
    img.onerror = ()=>toast('Не удалось загрузить фото');
    img.src = e.target.result;
  };
  reader.onerror = ()=>toast('Не удалось прочитать файл');
  reader.readAsDataURL(file);
}
function ruDateToISO(s){
  if(!s) return '';
  const m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return '';
  return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
}

  };

function showcaseHTML(showcase, shelfSkinId){
  const ranked = showcase.map((s,i)=>({fid:s.fid, count:s.count, tier:s.tier||0, rank:i+1, fig:FIGS[s.fid]})).filter(x=>x.fig);
  if(!ranked.length) return '';
  const order = [ranked[1], ranked[0], ranked[2]].filter(Boolean);
  const skin = shelfSkinId && SHELF_SKINS[shelfSkinId] ? SHELF_SKINS[shelfSkinId] : null;
  const bgStyle = skin && skin.bg ? ' style="background:'+skin.bg+'"' : '';
  return '<div class="shelf rounded-xl px-4 pt-5 pb-3 flex items-end justify-center gap-4 min-h-[150px]"'+bgStyle+'>'
    + order.map(item=>shelfItemHTML(item.fig, item.rank, item.rank===1, item.tier)).join('')
  + '</div>';
}
function myShowcase(){
  const counts = {};
  state.col.forEach(c=>{ const t=c.tier||0; const k=c.fid+'|'+t; counts[k]=(counts[k]||0)+1; });
  let items;
  if(state.widget && state.widget.length){
    items = state.widget.map(w=>({fid:w.fid, tier:w.tier||0, count:counts[w.fid+'|'+(w.tier||0)]||0}));
  } else {
    // Авто-витрина: берём для каждой фигурки лучший имеющийся тир
    const best = {};
    Object.keys(counts).forEach(k=>{
      const i = k.lastIndexOf('|'); const fid=k.slice(0,i), tier=+k.slice(i+1);
      if(!best[fid] || tier>best[fid].tier) best[fid] = {tier, count:counts[k]};
    });
    items = Object.keys(best).map(fid=>({fid, tier:best[fid].tier, count:best[fid].count}));
  }
  items = items.filter(it=>it.count>0);
  items.sort((a,b)=> RAR_ORDER[FIGS[b.fid].rar]-RAR_ORDER[FIGS[a.fid].rar] || b.tier-a.tier);
  return items.slice(0,3);
}

function shareText(title, text){
  if(navigator.share){
    navigator.share({title, text}).catch(()=>{});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast('📋 Скопировано в буфер обмена!');
    }).catch(()=>{
      toast('Не удалось скопировать — попробуйте вручную');
    });
    return;
  }
  toast('Поделиться не поддерживается на этом устройстве');
}

/* ============ РЫНОК ОБМЕНОВ ============ */
// Курс: 100 🪙 ≈ 1$ (соответствует стартовому пакету дублонов в магазине).
// Обычная фигурка стоит не меньше 100 🪙, т.е. не меньше 1$.
const CRYSTAL_TO_USD = 0.01;
const MARKET_PRICE = {C:100, U:175, R:350, E:750, L:2000};
function usd(crystals){ return (crystals*CRYSTAL_TO_USD).toFixed(2); }
function priceForRarity(rar){
  const base = MARKET_PRICE[rar] || MARKET_PRICE.C;
  // цена никогда не падает ниже базовой — только растёт при "повышенном спросе"
  const jitter = 1 + Math.random()*0.35;
  return Math.max(base, Math.round(base*jitter/5)*5);
}
function marketEstimateRange(rar){
  const base = MARKET_PRICE[rar] || MARKET_PRICE.C;
  return { lo: base, hi: Math.round(base*1.35/5)*5 };
}

/* ============ ПРОКАЧКА ФИГУРОК (ФОЙЛ/ГОЛО/ПОЛИХРОМ) ============ */
// Две одинаковые копии одного варианта можно слить в одну улучшенную того же
// уровня редкости. Ценность каждого следующего тира = x1.8 от предыдущего —
// то есть немного МЕНЬШЕ, чем сумма двух копий, которые ушли на слияние (2×0.9).
// Улучшенные фигурки остаются коллекционными — они не продаются на рынке.
const FOIL_TIERS = [
  { label:'', icon:'', glow:'#D4AF37', mult:1 },
  { label:'Фольгированная', icon:'✨', glow:'#FBBF24', mult:1.8 },
  { label:'Голографическая', icon:'🌈', glow:'#60A5FA', mult:3.24 },
  { label:'Полихромная', icon:'💎', glow:'#F472B6', mult:5.832 },
];
function tierMult(t){ return (FOIL_TIERS[t]||FOIL_TIERS[0]).mult; }
function figPrice(fid, tier){
  const f = FIGS[fid];
  const base = MARKET_PRICE[f.rar] || MARKET_PRICE.C;
  return Math.round(base*tierMult(tier||0)/5)*5;
}
function copiesOf(fid, tier){
  return state.col.filter(c=>c.fid===fid && (c.tier||0)===tier).length;
}
function canUpgrade(fid, tier){
  if(tier>=FOIL_TIERS.length-1) return false;
  const cfg = UPGRADE_COST[tier+1];
  return copiesOf(fid, tier)>=2 && state.powder>=cfg.powder;
}
function upgradeBlockReason(fid, tier){
  if(tier>=FOIL_TIERS.length-1) return null;
  const cfg = UPGRADE_COST[tier+1];
  const have = copiesOf(fid, tier);
  if(have<2 && state.powder<cfg.powder) return 'Нужно ещё '+(2-have)+' копи'+(2-have===1?'ю':'и')+' и 🧨 '+(cfg.powder-state.powder)+' пороха';
  if(have<2) return 'Нужно ещё '+(2-have)+' копи'+(2-have===1?'ю':'и')+' этого варианта';
  if(state.powder<cfg.powder) return 'Не хватает пороха: нужно 🧨 '+cfg.powder+' (есть '+state.powder+')';
  return null;
}
function effectiveUpgradeChance(tier){
  const cfg = UPGRADE_COST[tier+1];
  if(!cfg) return 0;
  return Math.min(0.95, cfg.chance + cannonChanceBonus());
}
function fireCannon(fid, tier){
  const cfg = UPGRADE_COST[tier+1];
  if(!cfg || !canUpgrade(fid, tier)){ toast(upgradeBlockReason(fid,tier) || 'Пушка не готова'); return; }
  const chance = effectiveUpgradeChance(tier);
  // Заряжаем пушку: списываем порох и ДВЕ копии сразу — назад пути нет.
  state.powder -= cfg.powder;
  let removed = 0;
  for(let i=state.col.length-1; i>=0 && removed<2; i--){
    if(state.col[i].fid===fid && (state.col[i].tier||0)===tier){ state.col.splice(i,1); removed++; }
  }
  save(); updateHud(); renderTreasury();
  const btn = $('#doUpgrade');
  if(btn){ btn.disabled = true; btn.textContent = '🔫 Заряжаем пушку…'; }
  const cannonImg = $('#cannonFireImg');
  if(cannonImg) cannonImg.classList.add('cannonCharging');
  vibrate([30,30,30,30,30]);
  setTimeout(()=>{
    const success = Math.random() < chance;
    if(success){
      const newTier = tier+1;
      state.col.push({fid, tier:newTier, island:FIGS[fid].island, at:Date.now()});
      save(); updateHud(); checkAch(); confetti(); vibrate([50,70,110,70,140]);
      const ft = FOIL_TIERS[newTier];
      toast('🔥 Успех! «'+FIGS[fid].name+'» стала '+ft.icon+' '+ft.label+'!');
    } else {
      save(); vibrate([250,100,250]);
      toast('💥 Взрыв! Пушка уничтожила всё содержимое без остатка…');
    }
    closeDetail();
    renderTreasury();
  }, 1200);
}
function canUpgradeCannon(){
  const next = CANNON_TIERS[(state.cannonLevel||0)+1];
  return next && state.crystals>=next.cost;
}
function upgradeCannonLevel(){
  const next = CANNON_TIERS[(state.cannonLevel||0)+1];
  if(!next){ toast('Пушка уже максимального уровня'); return; }
  if(state.crystals<next.cost){ toast('Не хватает дублонов: нужно 🪙 '+next.cost); return; }
  state.crystals -= next.cost;
  state.cannonLevel = (state.cannonLevel||0)+1;
  save(); updateHud(); confetti(); vibrate([40,60,90]);
  toast('🔫 Пушка улучшена до уровня «'+next.name+'»! +'+Math.round(next.chanceBonus*100)+'% к шансу успеха');
}
function genMarketListing(seedIdx){
  const name = BOT_POOL_NAMES[seedIdx % BOT_POOL_NAMES.length];
  const avatar = AVATAR_OPTIONS[(seedIdx*3+1) % AVATAR_OPTIONS.length];
  const offerFig = FIGLIST[(seedIdx*17+5) % FIGLIST.length];
  const base = { id: 'lst_'+(state.nextMarketId++), isMine:false,
    sellerName:name, sellerAvatar:avatar, sellerPhoto:null,
    offerFid: offerFig.id, createdAt: Date.now()-seedIdx*3600000 };
  if(seedIdx % 5 === 0){
    return Object.assign(base, { type:'sale', price: priceForRarity(offerFig.rar), wantFid:null, wantRarity:null });
  }
  const wantSpecific = seedIdx % 2 === 0;
  let wantFid=null, wantRarity=null;
  if(wantSpecific){
    let w = FIGLIST[(seedIdx*29+11) % FIGLIST.length];
    if(w.id===offerFig.id) w = FIGLIST[(seedIdx*29+12) % FIGLIST.length];
    wantFid = w.id;
  } else {
    wantRarity = ['C','U','R','E','L'][seedIdx % 5];
  }
  return Object.assign(base, { type:'barter', wantFid, wantRarity });
}
function ensureMarketSeed(){
  if(!state.market.length){
    for(let i=1;i<=10;i++) state.market.push(genMarketListing(i));
    save();
  }
}
function canFulfillListing(l){
  if(l.type==='sale') return state.crystals >= l.price;
  if(l.wantFid) return state.col.some(c=>c.fid===l.wantFid);
  if(l.wantRarity) return state.col.some(c=>FIGS[c.fid].rar===l.wantRarity);
  return false;
}
function wantLabel(l){
  if(l.type==='sale') return null;

}

let marketQuery = '';
function renderMarketSearch(qRaw){
  const box = $('#marketSearchResults');
  const q = qRaw.trim().toLowerCase();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const matches = FIGLIST.filter(f=>f.name.toLowerCase().includes(q)).slice(0,6);
  box.classList.remove('hidden');
  if(!matches.length){
    box.innerHTML = '<div class="text-center text-xs py-3 rounded-xl border" style="color:var(--txt2);border-color:var(--line);background:var(--panel)">Ничего не найдено по запросу «'+qRaw+'»</div>';
    return;
  }
  box.innerHTML = matches.map(f=>{
    const r = RARITY[f.rar];
    const {lo,hi} = marketEstimateRange(f.rar);
    const active = state.market.filter(l=>!l.isMine && l.type==='sale' && l.offerFid===f.id);
    let statusLine;
    if(active.length){
      const prices = active.map(l=>l.price);
      const mn = Math.min(...prices), mx = Math.max(...prices);
      statusLine = '<div class="text-[11px] mt-1" style="color:#34D399">🟢 Сейчас продаётся: '+active.length+' шт. · 🪙 '+(mn===mx?mn:mn+'–'+mx)+' <span style="color:var(--txt2)">(≈$'+usd(mn)+(mn===mx?'':'–$'+usd(mx))+')</span></div>';
    } else {
      statusLine = '<div class="text-[11px] mt-1" style="color:var(--txt2)">Сейчас никто не продаёт — ниже ориентировочная рыночная цена</div>';
    }
    return '<div data-searchfig="'+f.id+'" class="flex items-center gap-2.5 p-2.5 rounded-xl border mb-2 cursor-pointer" style="background:var(--panel);border-color:var(--line)">'
      + '<div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg shrink-0" style="background:'+r.color+'22;border:1px solid '+r.color+'55">'+f.emoji+'</div>'
      + '<div class="flex-1 min-w-0">'
      +   '<div class="text-xs font-bold truncate">'+f.name+' <span style="color:'+r.color+'">· '+r.short+'</span></div>'
      +   '<div class="text-[11px]" style="color:var(--txt2)">Рыночная цена: 🪙 '+lo+(lo===hi?'':'–'+hi)+' <span>(≈$'+usd(lo)+(lo===hi?'':'–$'+usd(hi))+')</span></div>'
      +   statusLine
      + '</div>'
    + '</div>';
  }).join('');
  $$('#marketSearchResults [data-searchfig]').forEach(el=>el.onclick = ()=>{
    const f = FIGS[el.dataset.searchfig];
    marketQuery = f.name; $('#marketSearch').value = f.name;
    renderMarket();
  });
}
function renderMarket(){
  ensureMarketSeed();
  renderMarketSearch(marketQuery);
  const q = marketQuery.trim().toLowerCase();
  const matchesQ = l => !q || FIGS[l.offerFid].name.toLowerCase().includes(q);
  const mine = state.market.filter(l=>l.isMine && matchesQ(l));
  const others = state.market.filter(l=>!l.isMine && matchesQ(l));
  const myBox = $('#myListings');
  myBox.innerHTML = mine.length ? mine.map(listingHTML).join('') :
    '<div class="text-center text-xs py-4" style="color:var(--txt2)">'+(q?'Среди ваших объявлений нет совпадений':'У вас нет активных объявлений')+'</div>';
  $$('#myListings [data-cancel]').forEach(el=>el.onclick = ()=>cancelListing(el.dataset.cancel));
  $('#marketListTitle').textContent = q ? 'Обмены по запросу «'+marketQuery+'»' : 'Доступные обмены';
  const listBox = $('#marketList');
  listBox.innerHTML = others.length ? others.map(listingHTML).join('') :
    '<div class="text-center text-xs py-4" style="color:var(--txt2)">'+(q?'Никто пока не выставил такую фигурку на обмен':'Пока нет предложений от других капитанов')+'</div>';
  $$('#marketList [data-trade]').forEach(el=>el.onclick = ()=>tryTrade(el.dataset.trade));
  $$('#marketList [data-buy]').forEach(el=>el.onclick = ()=>tryBuy(el.dataset.buy));
}
function tryBuy(id){
  const l = state.market.find(x=>x.id===id);
  if(!l || l.isMine || l.type!=='sale') return;
  if(state.crystals < l.price){ toast('Не хватает дублонов 🪙 — нажмите на баланс вверху, чтобы пополнить'); return; }
  state.crystals -= l.price;
  state.col.push({fid:l.offerFid, island:FIGS[l.offerFid].island, at:Date.now()});
  renderMarket();
}
function tryTrade(id){
  const l = state.market.find(x=>x.id===id);
  if(!l || l.isMine || l.type==='sale') return;
  if(l.wantFid){
    const idx = state.col.findIndex(c=>c.fid===l.wantFid && !(c.tier));
    if(idx===-1){ toast('У вас нет подходящей фигурки для обмена'); return; }
    executeTrade(id, l.wantFid);
  } else {
    openTradePicker(id);
  }
}
function executeTrade(listingId, givenFid){
  const l = state.market.find(x=>x.id===listingId);
  if(!l) return;
  const idx = state.col.findIndex(c=>c.fid===givenFid && !(c.tier));
  if(idx===-1){ toast('Фигурка недоступна'); return; }
  state.col.splice(idx,1);
  state.col.push({fid:l.offerFid, island:FIGS[l.offerFid].island, at:Date.now()});
  closeTradePicker();
  renderMarket();
}

function cancelListing(id){
  const l = state.market.find(x=>x.id===id && x.isMine);
  if(!l) return;
  state.col.push({fid:l.offerFid, island:FIGS[l.offerFid].island, at:Date.now()});
  renderMarket();
}
function scheduleAutoFulfill(id){
  const delay = 8000 + Math.random()*15000;
  setTimeout(()=>{
    const l = state.market.find(x=>x.id===id && x.isMine);
    if(!l) return;
    if(Math.random() < 0.65){
      state.market = state.market.filter(x=>x.id!==id);
      if(l.type==='sale'){
        state.crystals += l.price;
        save(); updateHud(); checkAch();
        confetti(); vibrate([40,50,80]);
        toast('💰 Ваша фигурка продана! Получено '+l.price+' 🪙');
      } else {
        let gotFid = l.wantFid;
        if(!gotFid){
          const pool = FIGLIST.filter(f=>f.rar===l.wantRarity);
          gotFid = pool[Math.floor(Math.random()*pool.length)].id;
        }
        state.col.push({fid:gotFid, island:FIGS[gotFid].island, at:Date.now()});
        save(); updateHud(); checkAch();
        confetti(); vibrate([40,50,80]);
        toast('🎉 Ваше объявление выполнено! Вы получили «'+FIGS[gotFid].name+'»');
      }
      if($('#scr-market').classList.contains('active')) renderMarket();
    } else {
      scheduleAutoFulfill(id);
    }
  }, delay);
}

    } else {
      html += '<input id="wantSearch" type="text" placeholder="🔍 Поиск фигурки…" class="w-full mb-2 px-3 py-2 rounded-lg text-sm border" style="background:var(--panel);border-color:var(--line);color:var(--txt)">'
        + '<div id="wantGrid" class="grid grid-cols-4 gap-2 mb-4 max-h-[200px] overflow-y-auto no-sb"></div>';
    }

function defaultSeason(){
  const start = Date.now();
  return {
    name:'Волшебное королевство', level:1, premium:false,
    claimedPremium:[], col:[],
    lastLevelDate: new Date().toDateString(), // не todayStr() — defaultSeason() вызывается до объявления const todayStr
    startAt:start, endsAt: start + 30*86400000,
  };
}
function defaultState(){
  return {
    crystals:100, col:[], widget:[], openings:0,
    openBy:{pirate:0,medieval:0,future:0,greek:0,religion:0},
    history:[], ach:{}, freeCase:null,
    daily:{last:'', streak:0}, theme:'light',
    onboarded:false, created:Date.now(),
    registered:false,
    profile:{name:'', screenname:'', birthday:'', mobile:'', avatar:'🏴‍☠️', photo:null},
    clans:[], nextClanId:1, friends:{}, blocked:{},
    frames:[], equippedFrame:null,
    powder:0, shelfSkins:['wood'], equippedShelfSkin:'wood', cannonLevel:0,
    market:[], nextMarketId:1,
    season: defaultSeason(),
  };
}
let state = defaultState();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{ const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); state = Object.assign(defaultState(), s);
      state.openBy = Object.assign({pirate:0,medieval:0,future:0,greek:0,religion:0}, s.openBy||{});
      state.daily = Object.assign({last:'',streak:0}, s.daily||{});
      state.profile = Object.assign({name:'',screenname:'',birthday:'',mobile:'',avatar:'🏴‍☠️',photo:null}, s.profile||{});
      state.clans = Array.isArray(s.clans) ? s.clans : [];
      state.friends = (s.friends && typeof s.friends==='object') ? s.friends : {};
      state.blocked = (s.blocked && typeof s.blocked==='object') ? s.blocked : {};
      state.frames = Array.isArray(s.frames) ? s.frames.filter(id=>FRAMES[id]) : [];
      state.equippedFrame = (s.equippedFrame && state.frames.includes(s.equippedFrame)) ? s.equippedFrame : null;
      state.powder = typeof s.powder==='number' && s.powder>=0 ? s.powder : 0;
      state.cannonLevel = (typeof s.cannonLevel==='number' && s.cannonLevel>=0 && s.cannonLevel<CANNON_TIERS.length) ? s.cannonLevel : 0;
      state.shelfSkins = Array.isArray(s.shelfSkins) ? s.shelfSkins.filter(id=>SHELF_SKINS[id]) : [];
      if(!state.shelfSkins.includes('wood')) state.shelfSkins.unshift('wood');
      state.equippedShelfSkin = (s.equippedShelfSkin && state.shelfSkins.includes(s.equippedShelfSkin)) ? s.equippedShelfSkin : 'wood';
      state.market = Array.isArray(s.market) ? s.market : [];
      state.nextMarketId = typeof s.nextMarketId==='number' ? s.nextMarketId : 1;
      state.season = Object.assign(defaultSeason(), s.season||{});
      state.season.claimedPremium = Array.isArray(state.season.claimedPremium) ? state.season.claimedPremium : [];
      if(typeof state.season.lastLevelDate !== 'string') state.season.lastLevelDate = new Date().toDateString();
      state.season.col = Array.isArray(state.season.col) ? state.season.col : [];
      // Миграция: раньше сезонные фигурки хранились отдельно от основной коллекции —
      // переносим их в общую сокровищницу и очищаем старый список.
      if(state.season.col.length){
        state.season.col.forEach(c=>{ if(SEASON_FIGS[c.fid]) state.col.push({fid:c.fid, island:'season', at:c.at||Date.now()}); });
        state.season.col = [];
      }
      // Миграция: раньше полка хранила просто id фигурки — теперь ещё и тир (версию).
      state.widget = Array.isArray(state.widget) ? state.widget : [];
      state.widget = state.widget.map(w=> typeof w==='string' ? {fid:w, tier:0} : w).filter(w=>w && w.fid);
      // Миграция: если фигурка была удалена/переименована в новой версии игры
      // (например, список фигурок острова сократили), выбрасываем "осиротевшие"
      // записи — иначе игра падает на несуществующих fid (белый экран).
      state.col = state.col.filter(c=>FIGS[c.fid]);
      // Миграция: у части старых записей в коллекции отсутствовало поле island
      // (баг покупки/обмена/подарков) — из-за этого фигурка не засчитывалась
      // в прогресс острова. Восстанавливаем island по справочнику фигурок.
      state.col.forEach(c=>{ if(!c.island) c.island = FIGS[c.fid].island; });
      state.history = state.history.filter(h=>FIGS[h.fid]);
      state.market = state.market.filter(l=>FIGS[l.offerFid] && (!l.wantFid || FIGS[l.wantFid]));
      state.widget = state.widget.filter(w=>FIGS[w.fid]);
    }
  }catch(e){ state = defaultState(); }
}

function toast(msg){

function confetti(){
  const cv = $('#fx'); cv.classList.remove('hidden');
  const cx = cv.getContext('2d');
  const ph = $('#phone').getBoundingClientRect();
  cv.width = ph.width; cv.height = ph.height;
  const colors = ['#FBBF24','#A78BFA','#34D399','#60A5FA','#F472B6','#D4AF37'];
  const parts = Array.from({length:130},()=>({
    x: cv.width/2+(Math.random()-.5)*120, y: cv.height*.35,
    vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, s:4+Math.random()*5,
    c: colors[Math.floor(Math.random()*colors.length)], r:Math.random()*3, vr:(Math.random()-.5)*.3,
  }));
  const t0 = performance.now();
  (function anim(){
    const el = performance.now()-t0;
    cx.clearRect(0,0,cv.width,cv.height);
    for(const p of parts){
      p.vy += .12; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.globalAlpha = Math.max(0, 1-el/2200); cx.fillStyle = p.c;
      cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.7); cx.restore();
    }
    if(el < 2200) requestAnimationFrame(anim);
    else { cx.clearRect(0,0,cv.width,cv.height); cv.classList.add('hidden'); }
  })();
}

/* ---- сокровищница ---- */
const ui = {isl:'all', rar:'all', q:'', sort:'rarity', playerQuery:''};
function renderIslChips(){
  const box = $('#islChips');
  let html = chip('all','Все', ui.isl==='all');
  for(const id in ISLANDS){
    const total = id==='season' ? SEASON_FIGLIST.length : FIGDATA[id].length;
    html += chip(id, ISLANDS[id].icon+' '+uniqueOf(id)+'/'+total, ui.isl===id);
  }
  box.innerHTML = html;
  function chip(v,label,act){
    return '<button data-islchip="'+v+'" class="chip shrink-0 px-3 py-2 rounded-xl text-xs font-semibold border '+(act?'active':'')+'" '
      + 'style="border-color:var(--line);background:var(--panel);color:var(--txt)">'+label+'</button>';
  }
  $$('#islChips [data-islchip]').forEach(b=>b.onclick = ()=>{ ui.isl = b.dataset.islchip; renderTreasury(); });
}
function renderTreasury(){
  renderIslChips();
  paintShelfWidget();
  const owned = {};
  state.col.forEach(c=>{ const t=c.tier||0; const key=c.fid+'|'+t; owned[key] = (owned[key]||0)+1; });
  function splitKey(key){ const i=key.lastIndexOf('|'); return { fid:key.slice(0,i), tier:+key.slice(i+1) }; }
  let list = Object.keys(owned).map(key=>{ const {fid,tier} = splitKey(key); return { key, fid, tier, fig: FIGS[fid] }; });
  if(ui.isl!=='all') list = list.filter(x=>x.fig.island===ui.isl);
  if(ui.rar!=='all') list = list.filter(x=>x.fig.rar===ui.rar);
  if(ui.q) list = list.filter(x=>x.fig.name.toLowerCase().includes(ui.q.toLowerCase()));
  function firstAt(key){ const {fid,tier} = splitKey(key); const c = state.col.find(x=>x.fid===fid && (x.tier||0)===tier); return c ? c.at : 0; }
  const sorters = {
    rarity:(a,b)=>RAR_ORDER[b.fig.rar]-RAR_ORDER[a.fig.rar] || b.tier-a.tier,
    score:(a,b)=>(RARITY[b.fig.rar].score*tierMult(b.tier))-(RARITY[a.fig.rar].score*tierMult(a.tier)),
    name:(a,b)=>a.fig.name.localeCompare(b.fig.name,'ru') || a.tier-b.tier,
    island:(a,b)=>a.fig.island.localeCompare(b.fig.island),
    date:(a,b)=>firstAt(b.key)-firstAt(a.key),
  };
  list.sort(sorters[ui.sort]||sorters.rarity);
  $('#tresStats').textContent = 'Уникальных: '+uniqueTotal()+' / '+TOTAL_BASE_FIGS+' · Копий: '+state.col.length+' · Очки: '+totalScore()+' · 🧨 '+state.powder;
  $('#tresGrid').innerHTML = list.map(x=>'<div data-fig="'+x.fid+'" data-tier="'+x.tier+'">'+cardHTML(x.fig,{dup:owned[x.key], tier:x.tier})+'</div>').join('');
  const empty = $('#tresEmpty');
  if(!list.length){
    empty.classList.remove('hidden');
    empty.innerHTML = state.col.length
      ? 'Ничего не найдено — попробуйте другие фильтры 🧐'
      : 'Сокровищница пуста.<br>Откройте первый кейс на карте островов! 🗺️';
  } else empty.classList.add('hidden');
  $$('#tresGrid [data-fig]').forEach(el=>el.onclick = ()=>showDetail(el.dataset.fig, +el.dataset.tier));
}

/* ---- полка ---- */
function toggleWidgetFig(fid, tier){
  tier = tier||0;
  const i = state.widget.findIndex(w=>w.fid===fid && (w.tier||0)===tier);
  if(i>=0){ state.widget.splice(i,1); toast('Фигурка убрана с полки'); }
  else {
    if(state.widget.length>=3){ toast('На полке максимум 3 фигурки 🖼️'); return; }
    state.widget.push({fid, tier}); toast('Фигурка установлена на полку! ✨');
  }
  save(); if($('#scr-treasury').classList.contains('active')) paintShelfWidget();
}
let widgetPickerOpen = false;
function paintShelfWidget(){
  const shelf = $('#shelfBox');
  const skin = SHELF_SKINS[state.equippedShelfSkin] || SHELF_SKINS.wood;
  shelf.style.background = skin.bg || ''; // null у 'wood' — используется базовый CSS-класс .shelf
  if(!state.widget.length){
    shelf.innerHTML = '<div class="text-center text-xs py-6" style="color:#fff9">Полка пуста.<br>Нажмите «Изменить» ниже 👇</div>';
  } else {
    shelf.innerHTML = state.widget.map(w=>{
      const f = FIGS[w.fid], r = RARITY[f.rar], tier = w.tier||0;
      return '<div class="w-[74px] '+(f.rar==='L'||f.rar==='E' ? 'shelfGlow':'')+'" style="--rc:'+r.color+'">'
        + cardHTML(f,{tier:tier}) + '</div>';
    }).join('');
  }
  const skinBox = $('#shelfSkinPicker');
  skinBox.innerHTML = SHELF_SKIN_LIST.map(sk=>{
    const owned = state.shelfSkins.includes(sk.id);
    const eq = state.equippedShelfSkin===sk.id;
    return '<button data-skin="'+sk.id+'" '+(owned?'':'disabled')+' title="'+(owned?sk.name:'???')+'" class="shrink-0 w-10 h-10 rounded-lg border-2 flex items-center justify-center text-[9px] font-black" '
      + 'style="border-color:'+(eq?'#D4AF37':'var(--line)')+';background:'+(owned?(sk.bg||'repeating-linear-gradient(0deg,#8a5a3a 0 10px,#6b4226 10px 20px)'):'var(--panel2)')+';opacity:'+(owned?'1':'.4')+'">'
      + (owned ? (eq?'✓':'') : '🔒')
      + '</button>';
  }).join('');
  $$('#shelfSkinPicker [data-skin]').forEach(b=>b.onclick = ()=>{
    const id = b.dataset.skin;
    if(!state.shelfSkins.includes(id)) return;
    state.equippedShelfSkin = id;
    save(); toast('🗄️ Полка «'+SHELF_SKINS[id].name+'» установлена');
    paintShelfWidget();
  });
  const picker = $('#widgetPicker');
  picker.classList.toggle('hidden', !widgetPickerOpen);
  if(!widgetPickerOpen) return;
  const counts = {};
  state.col.forEach(c=>{ const t=c.tier||0; const k=c.fid+'|'+t; counts[k]=(counts[k]||0)+1; });
  const owned = Object.keys(counts).map(k=>{
    const i = k.lastIndexOf('|'); const fid=k.slice(0,i), tier=+k.slice(i+1);
    return { fid, tier, fig:FIGS[fid] };
  }).sort((a,b)=>RAR_ORDER[b.fig.rar]-RAR_ORDER[a.fig.rar] || b.tier-a.tier);
  picker.innerHTML = owned.length
    ? owned.map(x=>{
        const sel = state.widget.some(w=>w.fid===x.fid && (w.tier||0)===x.tier);
        return '<button data-w="'+x.fid+'" data-wt="'+x.tier+'" class="relative rounded-xl p-1 border-2 transition-all '+(sel?'':'opacity-70')+'" '
          + 'style="border-color:'+(sel?'#D4AF37':'transparent')+'">'+cardHTML(x.fig,{tier:x.tier})
          + (sel?'<div class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-amber-400 text-black text-[10px] font-black flex items-center justify-center z-10">✓</div>':'')
          + '</button>';
      }).join('')
    : '<div class="col-span-4 text-center text-sm py-8" style="color:var(--txt2)">Сначала откройте пару кейсов 🗺️</div>';
  $$('#widgetPicker [data-w]').forEach(b=>b.onclick = ()=>toggleWidgetFig(b.dataset.w, +b.dataset.wt));
}

function claimDaily(){
  const today = todayStr();
  if(state.daily.last === today) return;
  const yesterday = new Date(Date.now()-864e5).toDateString();
  state.daily.streak = (state.daily.last === yesterday) ? state.daily.streak+1 : 1;
  if(state.daily.streak>5) state.daily.streak = 1;
  const reward = 5 + state.daily.streak*5;
  state.crystals += reward; state.daily.last = today;
  checkSeasonDayLevel();
  save(); updateHud(); renderProfile(); confetti();
  toast('📅 Ежедневный бонус: +'+reward+' 🪙 (день '+state.daily.streak+')');
}

/* ============ ЛУТБОКС ============ */
function rollRarity(odds){
  let r = Math.random()*100;
  for(const k of ['C','U','R','E','L']){ r -= odds[k]; if(r<=0) return k; }
  return 'C';
}
function openCase(islId, type){
  const isl = ISLANDS[islId], cs = isl.cases[type];
  const free = type==='std' && state.freeCase===islId;
  const cost = free ? 0 : cs.cost;
  if(state.crystals < cost){ toast('Не хватает дублонов! Нажмите на баланс вверху, чтобы пополнить 🪙'); return; }
  state.crystals -= cost;
  if(free) state.freeCase = null;
  const rar = rollRarity(cs.odds);
  const pool = FIGLIST.filter(f=>f.island===islId && f.rar===rar);
  const fig = pool[Math.floor(Math.random()*pool.length)];
  const isNew = !state.col.some(c=>c.fid===fig.id);
  state.col.push({fid:fig.id, island:islId, at:Date.now()});
  state.openings++; state.openBy[islId]++;
  state.history.unshift({fid:fig.id, at:Date.now()});
  if(state.history.length>60) state.history.length = 60;
  let cascadeMsg = null;
  if(state.openings % 5 === 0){
    const bonus = state.openings;
    state.crystals += bonus;
    cascadeMsg = '🎉 Бонус за '+state.openings+' открытий: +'+bonus+' 🪙';
  }
  const extraMsgs = [];
  const wonFrame = tryDropFrame(rar, type);
  if(wonFrame){
    if(state.frames.includes(wonFrame.id)){
      const refund = FRAME_DUP_VALUE[wonFrame.rar] || 20;
      state.crystals += refund;
      extraMsgs.push('🖼️ Дубликат рамки «'+wonFrame.name+'» обменян на 🪙 '+refund);
    } else {
      state.frames.push(wonFrame.id);
      extraMsgs.push('🖼️ Новая рамка профиля: «'+wonFrame.name+'»! Наденьте её в разделе профиля');
    }
  }
  const wonSkin = tryDropShelfSkin(type);
  if(wonSkin && !state.shelfSkins.includes(wonSkin.id)){
    state.shelfSkins.push(wonSkin.id);
    extraMsgs.push('🗄️ Новая полка для витрины: «'+wonSkin.name+'»! Смените её в сокровищнице');
  }
  const powderWon = tryDropPowder(type);
  if(powderWon>0){
    state.powder += powderWon;
    extraMsgs.push('🧨 Порох +'+powderWon+' (всего: '+state.powder+')');
  }
  if(cascadeMsg) extraMsgs.push(cascadeMsg);
  save(); updateHud(); checkAch();
  showReveal(fig, isNew, islId, type, extraMsgs);
}

        s.className = 'spark';

        s.style.setProperty('--dy', Math.sin(ang)*dist+'px');

  }

    ov.classList.add('hidden'); ov.classList.remove('flex');
    if($('#scr-island').classList.contains('active') && currentIsland===islId) renderIsland(islId);
    updateHud();
  }
}

/* ---- достижения ---- */
function checkAch(){
  const newly = [];
  for(const a of ACHS){
    if(state.ach[a.id]) continue;
    const cur = a.prog()[0], need = a.prog()[1];
    if(cur >= need){ state.ach[a.id] = true; state.crystals += a.reward; newly.push(a); }
  }
  if(newly.length){
    save(); updateHud();
    setTimeout(()=>{
      newly.forEach(a=>toast('🏆 Достижение «'+a.name+'»! +'+a.reward+' 🪙'));
      confetti(); vibrate([50,60,100]);
    }, 800);
  }
}

      + obFeat('🖼️','Полка-виджет','Выставляйте любимые фигурки напоказ')
      + obBtn('Дальше');
  } else {
    html = '<div class="font-display font-bold text-xl mb-1">Выбери первый остров</div>'
      + '<div class="text-xs mb-5" style="color:var(--txt2)">Открыты все — начни с любого. На выбранном острове тебя ждёт бесплатный кейс + 100 🪙</div>'
      + '<div class="w-full space-y-2.5">';
    for(const id in ISLANDS){
      if(ISLANDS[id].hidden) continue;
      const isl = ISLANDS[id], sel = obIsland===id;
      html += '<button data-ob="'+id+'" class="w-full flex items-center gap-3 rounded-2xl p-3.5 border text-left transition-all" '
        + 'style="background:'+(sel?isl.c1+'cc':'var(--panel)')+';border-color:'+(sel?isl.c2:'var(--line)')+'">'
        + '<span class="text-2xl">'+isl.icon+'</span>'
        + '<span class="flex-1 font-bold text-sm">'+isl.name+'</span>'
        + (sel?'<span style="color:'+isl.c2+'">✔</span>':'')
        + '</button>';
    }
    html += '</div>' + obBtn('🎁 Начать приключение', true);
  }
  ov.innerHTML = html;
  function obFeat(ic,t,d){
    return '<div class="w-full flex items-center gap-3 rounded-2xl p-3.5 border mb-2.5 text-left" style="background:var(--panel);border-color:var(--line)">'
      + '<span class="text-2xl">'+ic+'</span><div><div class="font-bold text-sm">'+t+'</div>'
      + '<div class="text-[11px]" style="color:var(--txt2)">'+d+'</div></div></div>';
  }
  function obBtn(label, final){
    return '<button id="obNext" class="mt-6 w-full py-4 rounded-2xl font-display font-bold text-sm text-black" '
      + 'style="background:linear-gradient(90deg,#D4AF37,#f5d76e)">'+label+'</button>';
  }
  $$('[data-ob]').forEach(b=>b.onclick = ()=>{ obIsland = b.dataset.ob; renderOnboard(); });
  $('#obNext').onclick = ()=>{
    if(obStep<2){ obStep++; renderOnboard(); return; }
    state.onboarded = true; state.freeCase = obIsland;
    save();
    ov.classList.add('hidden'); ov.classList.remove('flex');
    toast('🎁 Стартовый кейс ждёт на острове '+ISLANDS[obIsland].icon+' + 100 🪙');
    go('island', obIsland);
  };
}

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
load();
checkSeasonDayLevel();
applyTheme();
updateHud();
$$('nav [data-tab]').forEach(b=>b.onclick = ()=>go(b.dataset.tab));
$('#tresQ').addEventListener('input', e=>{ ui.q = e.target.value.trim(); renderTreasury(); });
$('#rarSel').addEventListener('change', e=>{ ui.rar = e.target.value; renderTreasury(); });
$('#sortSel').addEventListener('change', e=>{ ui.sort = e.target.value; renderTreasury(); });
$('#createClanBtn').onclick = openCreateClan;
$('#playerSearch').addEventListener('input', e=>{ ui.playerQuery = e.target.value; paintClansList(); });
$('#widgetToggleBtn').onclick = ()=>{
  widgetPickerOpen = !widgetPickerOpen;
  $('#widgetToggleBtn').textContent = widgetPickerOpen ? 'Готово' : 'Изменить';
  paintShelfWidget();
};
$('#createListingBtn').onclick = openCreateListing;
$('#marketSearch').addEventListener('input', e=>{ marketQuery = e.target.value; renderMarket(); });
$('#hudCrystals').onclick = openShop;
if(!state.registered){
  regEditing = false; regStep = 0;
  regDraft = {name:'', screenname:'', avatar:AVATAR_OPTIONS[0], birthday:'', mobile:'', photo:null};
  renderRegister();
} else if(!state.onboarded){ renderOnboard(); } else { go('map'); }
})();
</script>
</body>
</html>
